<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Learning </title>
        <style>
                .abc{
                        font-family: arial;
                        font-size: 20px;
                        font-weight: bold;
                        width: 320px; 
                        color: black;
                        
                }
                .second-p{
                        color: rgb(176, 163, 148);
                }
                .last-p{
                        font-family: arial;
                        font-size: 15px;
                        width: 285px;

                }
                .task{
                        background-color: red;
                        color: white;
                        padding-top: 15px;
                        padding-bottom: 15px;
                        text-align: center;
                        font-family: arial;
                        font-size: 18px;

                }
                span{ 
                        padding-top: 15px;
                        padding-bottom: 15px; 
                        font-family: arial;
                        font-size: 18px; 
                        cursor: pointer;
                } 
                span:hover{
                         
                        text-decoration: underline; 
                }
        </style>
</head>
<body>
        <p class="abc">
                Talking Tech and AI with Google CEO Sundar Pichai!
        </p>
        <p class="second-p"> 
                3.4M views · 6 months ago
        </p>

        <p class="second-p">
                Marques Brownlee ✓
        </p>
        <p class="last-p">
                Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from Google's CEO. Shoutout to Sundar!
        </p>

        <p class="task">
                Shop early for the best selection of holiday favourites. <span>Shop now</span>
        </p>

</body>
</html>
