<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
                .first{
                        color: black;
                        font-family: arial;
                        font-size: 20px;
                        font-weight: bold;
                }
                span{
                        color: gray;
                        font-size: 10px;
                }
                .second{
                        font-family: arial;
                        font-size: 15px;
                        color: green;
                }
                .three{
                        color: grey;
                        font-family: arial;
                        font-size:13px;
                }
                #red{
                        color: red;
                        font-size: 13px;
                }
        </style>
</head>
<body>
        <p class="first">1,049.61 <span>USD</span></p>
        <p class="second">+18.05(1.75%)today</p>

</html>
