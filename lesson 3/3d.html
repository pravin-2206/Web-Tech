<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap</title>
        <style>
                .get-btn {
                        background-color: blueviolet;
                        color: white;
                        border: none;
                        border-radius: 4px;
                        font-weight: bold;
                        font-size: 20px;
                        height: 50px;
                        width: 150px;
                        cursor: pointer;
                }
                .get-btn:hover{
                        background-color: rgba(112, 78, 78, 0.895);
                        color: blueviolet;
                        opacity: 0.8;

                }

                .dow-btn {
                        background-color: white;
                        color: black;
                        border: none;
                        border-style: solid;
                        border-width: 1px;
                        border-radius: 4px;
                        font-weight: bold;
                        font-size: 20px;
                        height: 50px;
                        width: 150px;
                        margin-left: 10px;
                }
                .dow-btn:hover{
                        background-color: black;
                        color: white;
                }
        </style>
</head>

<body>
        <button class="get-btn">
                Get Start

        </button>
        <button class="dow-btn">
                Download

        </button>
</body>

</html>
