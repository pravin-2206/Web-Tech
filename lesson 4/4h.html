<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pagination</title>
        <style>
                .back-btn{
                        background-color: rgb(222, 230, 233);
                        color: black;
                        border: none;
                        padding-right: 15px;
                        padding-left: 15px;
                        padding-top: 8px;
                        padding-bottom: 8px;
                        border-radius: 2px;
                        border-style: solid;
                        border-width: 1px;
                        border-color: black;
                }
                .next-btn{
                        background-color: rgb(222, 230, 233);
                        color: black;
                        border: none;
                        padding-right: 15px;
                        padding-left: 15px;
                        padding-top: 8px;
                        padding-bottom: 8px;
                        border-radius: 2px;
                        border-style: solid;
                        border-width: 1px;
                        border-color: black;

                }
        </style>
</head>
<body>
        <button class="back-btn">Back</button>
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <button class="next-btn">Next</button>
</body>
</html>
