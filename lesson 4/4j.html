<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3 D click</title>
        <style>
                .shadow-btn{
                        background-color: green;
                        color: white;
                        border: none;
                        padding-left: 25px;
                        padding-right: 25px;
                        padding-top: 15px;
                        padding-bottom: 15px;
                        font-size: 25px;
                        cursor: pointer; 
                        box-shadow: 5px 5px 5px #c19e6be2;
                }
                .shadow-btn:active { 
                        transition: box-shadow 10 5 6 red;
                        }
        </style>
</head>
<body>
        <button class="shadow-btn">Shadow</button>
</body>
</html>
