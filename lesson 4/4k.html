<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stretch</title>
</head>
<style>
        .one-btn {
                background-color: green;
                color: white;
                border: none;
                height: 60px;
                width: 150px;
                font-size: 30px;
                cursor: pointer;
        }

        .one-btn:hover {
                width: 200px;
                height: 60px;

        }

        .two-btn{
                background-color: green;
                color: white;
                border: none;
                height: 60px;
                width: 150px;
                font-size: 30px;
                cursor: pointer;
                margin-left: 20px;

        }
        .two-btn:hover{
                width: 200px;
                height: 60px;
                
        }
        .three-btn{
                background-color: green;
                color: white;
                border: none;
                height: 60px;
                width: 150px;
                font-size: 30px;
                cursor: pointer;
                margin-left: 20px;

        }
        .three-btn:hover{
                width: 200px;
                height: 60px;

        }
</style>

<body>
        <button class="one-btn">One</button>
        <button class="two-btn">Two</button>
        <button class="three-btn">Three</button>
</body>

</html>
