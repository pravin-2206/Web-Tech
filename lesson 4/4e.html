<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap</title>
        <style>
                .get-btn {
                        background-color: rgba(130, 74, 181, 0.845);
                        color: white;
                        border: none;
                        border-radius: 32px;
                        font-weight: bold;
                        font-size: 20px; 
                        padding-left: 28px;
                        padding-right: 28px;
                        padding-top: 15px;
                        padding-bottom: 15px;
                        cursor: pointer;
                }

                .get-btn:hover {
                        background-color: rgba(170, 138, 138, 0.823);
                        color: rgba(130, 74, 181, 0.845);
                        opacity: 0.8;
                }

                .dow-btn {
                        background-color: white;
                        color: rgba(130, 74, 181, 0.845);
                        border: none;
                        border-style: solid;
                        border-width: 1px;
                        border-radius: 25px;
                        font-weight: bold;
                        font-size: 20px; 
                        padding-left: 28px;
                        padding-right: 28px;
                        padding-top: 15px;
                        padding-bottom: 15px;
                        margin-left: 10px;
                        cursor: pointer;
                }

                .dow-btn:hover {
                        background-color: rgba(130, 74, 181, 0.845);
                        color: white;
                        opacity: 0.8;
                }
        </style>
</head>

<body>
        <button class="get-btn">
                Apply on company website

        </button>
        <button class="dow-btn">
                Save

        </button>
</body>

</html>
