<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3 button</title>
        <style>
                .sub-btn {
                        background-color: #ff0000;
                        color: white;
                        border: none;
                        padding-right: 25px;
                        padding-left: 25px;
                        padding-top: 10px;
                        padding-bottom: 10px;
                        cursor: pointer;
                        border-radius: 5px;
                }

                .sub-btn:hover {
                        background-color: rgba(10, 178, 178, 0.711);
                        color: #ff0000;
                        opacity: 0.8s;

                }

                .join-btn {
                        background-color: white;
                        color: blue;
                        border: none;
                        padding-right: 25px;
                        padding-left: 25px;
                        padding-top: 10px;
                        padding-bottom: 10px;
                        cursor: pointer;
                        border-radius: 2px;
                        border-style: solid;
                        border-width: 1px;
                        margin-left: 10px;


                }

                .join-btn:hover {
                        background-color: rgba(131, 174, 182, 0.745);
                        color: white;
                }

                .tweet-btn {
                        background-color: blue;
                        color: white;
                        border: none;
                        padding-right: 25px;
                        padding-left: 25px;
                        padding-top: 10px;
                        padding-bottom: 10px;
                        border-radius: 20px;
                        cursor: pointer;
                        margin-left: 10px;

                }

                .tweet-btn:hover {
                        background-color: aqua;
                        color: blue;
                        opacity: 0.5;
                }
        </style>
</head>

<body>
        <button class="sub-btn">SUBSCRIBE</button>
        <button class="join-btn">Join</button>
        <button class="tweet-btn">Tweet</button>
</body>

</html>
