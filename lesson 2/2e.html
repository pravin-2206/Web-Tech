<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap</title>
        <style>
                .get-btn {
                        background-color: rgba(130, 74, 181, 0.845);
                        color: white;
                        border: none;
                        border-radius: 32px;
                        font-weight: bold;
                        font-size: 20px;
                        height: 50px;
                        width: 300px;
                }

                .dow-btn {
                        background-color: white;
                        color: rgba(130, 74, 181, 0.845);
                        border: none;
                        border-style: solid;
                        border-width: 1px;
                        border-radius: 25px;
                        font-weight: bold;
                        font-size: 20px;
                        height: 50px;
                        width: 150px;
                        margin-left: 10px;
                }
        </style>
</head>

<body>
        <button class="get-btn">
                Apply on company website 

        </button>
        <button class="dow-btn">
                Save

        </button>
</body>

</html>
