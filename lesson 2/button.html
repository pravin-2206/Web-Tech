<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buttons</title>
        <style>
                .sub-btn{
                        background-color: red;
                        color: white;
                        border: none;
                        height: 40px;
                        width: 140px;
                        border-radius: 4px;
                        cursor:pointer;

                }
                .join-btn{
                        background-color: white;
                        border-color: rgba(0, 0, 255, 0.59);
                        border-style: solid;
                        border-width: 1px;
                        height: 40px;
                        width: 80px;
                        border-radius: 5px;
                        margin-left: 15px;

                }
                .twest-btn{
                        background-color: rgb(161, 161, 244);
                        color: white; 
                        border-radius: 32%;
                        border: none;
                        height: 52px;
                        width: 95px;
                        margin-left: 20px;
                        font-weight: bold;
                        font-size: 20px;
                        cursor:pointer;

                }

        </style>
</head>
<body>
        <button class="sub-btn">SUBSCRIBE</button>
        <button class="join-btn">JOIN</button>
        <button class="twest-btn">Twest</button>
</body>
</html>
