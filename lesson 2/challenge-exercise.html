<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Challenge Exercise</title>
        <style>
               a{
                font-size: 30px;
               }
                #nike{
                        color: black;
                        font-weight: solid; 
                        font-size: 35px;
                }
                .stock{
                        color: green;
                        font-size: 25px;

                }
                .add{
                        background-color: rgba(178, 178, 27, 0.914);
                        color: black;
                        border: none;
                        width: 150px;
                        height: 50px;
                        border-radius: 25px;
                        margin-left: 10px;
                        font-size: 20px;
                        font-weight: solid;
                }
                .buy{
                        background-color: rgba(214, 147, 24, 0.884);
                        color: black;
                        border: none;
                        width: 150px; 
                        height: 50px;
                        border-radius: 25px;
                        margin-left: 10px;
                        font-size: 20px;
                        font-weight: solid;
                }
                #deli{
                        font-size: 25px;
                }

        </style>
</head>

<body>
        <a href="https://www.amazon.in/" >Back to Amazon</a>
        <p id="nike">
                Nike Black Running Shoes
        </p>
        <p class="stock">
                $39-in stock
        </p>
        <p id="deli">
                Free delivery tomorrow.
        </p>
        <button class="add">Add to Card</button>
        <button class="buy">Buy now</button>
</body>

</html>
